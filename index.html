<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Трекер репетитора</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:var(--tg-theme-bg-color,#ffffff);
  --text:var(--tg-theme-text-color,#111827);
  --hint:var(--tg-theme-hint-color,#8a94a6);
  --card:var(--tg-theme-secondary-bg-color,#f2f5fa);
  --brand1:#2b6cff;--brand2:#19c3b0;--brand3:#7c4dff;
  --ok:#22a867;--bad:#e5484d;--warn:#f0a020;--plan:#7c4dff;--trial:#0ea5e9;--move:#8b5cf6;
  --radius:18px;
  --shadow:0 6px 22px rgba(30,60,120,.12);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font:15px/1.45 -apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);padding-bottom:110px;overflow-x:hidden}
button{font-family:inherit}
.hero{position:relative;padding:calc(16px + env(safe-area-inset-top)) 18px 58px;color:#fff;
  background:linear-gradient(135deg,var(--brand1),var(--brand3) 55%,var(--brand2));
  border-radius:0 0 34px 34px;overflow:hidden;transition:opacity .45s ease,filter .45s ease}
body:not(.on-stats) .hero{opacity:.2;filter:saturate(.7)}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.12)}
.hero::before{width:220px;height:220px;right:-70px;top:-80px}
.hero::after{width:140px;height:140px;left:-40px;bottom:-60px}
.hero-top{display:flex;align-items:center;gap:12px;position:relative;z-index:1;padding-right:48px}
.hero-top img{width:46px;height:46px;border-radius:13px;box-shadow:0 4px 14px rgba(0,0,0,.25);background:#fff3}
.hero-top h1{font-size:19px;margin:0;line-height:1.15}
.hero-top small{opacity:.85}
.gear{position:fixed;top:calc(14px + env(safe-area-inset-top));right:14px;z-index:30;width:38px;height:38px;border-radius:12px;border:0;
  background:rgba(43,108,255,.88);color:#fff;font-size:18px;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.sync{position:relative;z-index:1;display:inline-block;margin-top:10px;padding:3px 10px;border-radius:20px;background:rgba(255,255,255,.2);font-size:11.5px}
.hero-sum{position:relative;z-index:1;margin-top:12px}
.hero-sum .big{font-size:34px;font-weight:800;letter-spacing:-.5px}
.hero-sum .sub{opacity:.9;font-size:13px}
.goalbar{height:8px;border-radius:8px;background:rgba(255,255,255,.28);margin:10px 0 4px;overflow:hidden}
.goalbar i{display:block;height:100%;width:0;border-radius:8px;background:#fff;transition:width .8s cubic-bezier(.2,.8,.2,1)}
main{padding:0 14px;margin-top:-34px;position:relative;z-index:2}
.card{background:var(--card);border-radius:var(--radius);padding:14px;margin:12px 0;box-shadow:var(--shadow);animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.noanim .card,.noanim .kpi{animation:none}
h2{font-size:17px;margin:22px 4px 6px;display:flex;align-items:center;justify-content:space-between}
h2 .cnt{font-size:12px;color:var(--hint);font-weight:500}
.hint{color:var(--hint);font-size:13px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grow{flex:1;min-width:0}
.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.tabs{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;padding:6px;border-radius:26px;
  background:var(--card);box-shadow:0 10px 30px rgba(20,40,90,.22);z-index:20}
.tabs button{flex:1;border:0;background:none;color:var(--hint);padding:8px 0 6px;border-radius:20px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:.25s}
.tabs button span{font-size:19px;line-height:1}
.tabs button.active{color:#fff;background:linear-gradient(135deg,var(--brand1),var(--brand3));box-shadow:0 4px 12px rgba(43,108,255,.45)}
.fab{position:fixed;right:20px;bottom:calc(92px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;color:#fff;font-size:30px;line-height:1;
  background:linear-gradient(135deg,var(--brand2),var(--brand1));box-shadow:0 8px 22px rgba(25,195,176,.5);z-index:21;transition:transform .2s}
.fab:active{transform:scale(.92)}
.fab.hidden{display:none}

.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 12px;border-radius:20px;border:0;background:var(--card);color:var(--text);font-size:13px;box-shadow:var(--shadow);display:flex;align-items:center;gap:6px}
.chip em{font-style:normal;font-size:11px;min-width:18px;text-align:center;padding:1px 6px;border-radius:10px;background:rgba(127,127,127,.2)}
.chip.active{background:linear-gradient(135deg,var(--brand1),var(--brand3));color:#fff}
.chip.active em{background:rgba(255,255,255,.28)}

.seg{display:flex;gap:4px;padding:4px;border-radius:15px;background:var(--card);box-shadow:var(--shadow);margin:44px 0 10px}
.seg button{flex:1;border:0;padding:9px 6px;border-radius:11px;background:none;color:var(--hint);font-weight:600;font-size:14px}
.seg button.active{background:linear-gradient(135deg,var(--brand1),var(--brand3));color:#fff}
.mnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0}
.mnav b{font-size:18px;text-transform:capitalize}
.dl{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:9px;font-size:11px;font-weight:700;background:rgba(255,255,255,.28)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wh{font-size:10.5px;color:var(--hint);text-align:center}
.cd{aspect-ratio:1;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;background:rgba(127,127,127,.1);line-height:1.15}
.cd b{font-size:12px}
.cd.empty{background:none}
.cd.today{outline:2px solid var(--brand1)}
.mrow{display:block;width:100%;text-align:left;border:0;color:var(--text);background:var(--card);border-radius:14px;padding:11px 12px;margin:8px 0;box-shadow:var(--shadow)}
.mrow.sel{outline:2px solid var(--brand1)}
.mrow .nm{text-transform:capitalize;font-weight:700}
.dlt{font-size:11.5px;font-weight:700}
.dlt.up{color:var(--ok)}.dlt.down{color:var(--bad)}

.today{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,rgba(43,108,255,.14),rgba(25,195,176,.14))}
.today .ico{font-size:30px}
.wk .row{margin-bottom:8px}
.nav{width:32px;height:32px;border-radius:10px;border:0;background:rgba(127,127,127,.15);color:var(--text);font-size:18px}
.wkrow{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.wdb{border:0;background:rgba(127,127,127,.1);color:var(--text);border-radius:14px;padding:7px 0 5px;display:flex;flex-direction:column;align-items:center;gap:1px;transition:.2s}
.wdb small{font-size:10.5px;color:var(--hint)}
.wdb b{font-size:15px}
.wdb i{font-style:normal;font-size:10px;height:14px;min-width:14px;line-height:14px;border-radius:7px;color:#fff;padding:0 4px}
.wdb i.dot{background:var(--brand2)}
.wdb.today{outline:2px solid var(--brand1)}
.wdb.sel{background:linear-gradient(135deg,var(--brand1),var(--brand3));color:#fff}
.wdb.sel small{color:#fffd}

.day{font-size:13px;font-weight:700;color:var(--hint);margin:16px 6px 4px;text-transform:capitalize}
.lesson{display:flex;gap:12px;align-items:stretch;padding:12px;border-left:5px solid var(--c1)}
.time{min-width:48px;text-align:center}
.time b{display:block;font-size:16px}
.avatar{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:18px;flex:none}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;color:#fff;font-weight:600}
.t-done{background:var(--ok)}.t-cancel{background:var(--hint)}.t-planned{background:var(--plan)}
.t-unpaid{background:var(--warn)}.t-paid{background:var(--brand1)}.t-trial{background:var(--trial)}.t-custom{background:var(--brand3)}.t-clash{background:var(--bad)}.t-move{background:var(--move)}
.meta{display:flex;gap:10px;flex-wrap:wrap;color:var(--hint);font-size:12.5px;margin-top:3px}
.link{margin-top:6px;font-size:12.5px;color:var(--move);font-weight:600}
.actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:11px 16px;font-size:15px;font-weight:600;color:#fff;width:100%;
  background:linear-gradient(135deg,var(--brand1),var(--brand3));box-shadow:0 5px 14px rgba(43,108,255,.35)}
.btn.small{width:auto;padding:7px 12px;font-size:13px;box-shadow:none}
.btn.ghost{background:transparent;color:var(--brand1);border:1.5px solid var(--brand1);box-shadow:none}
.btn.move{background:transparent;color:var(--move);border:1.5px solid var(--move);box-shadow:none}
.btn.danger{background:var(--bad);box-shadow:none}
.btn.ok{background:var(--ok);box-shadow:none}
.btn:disabled{opacity:.45}
.empty{text-align:center;color:var(--hint);padding:36px 12px}
.empty .ico{font-size:44px;display:block;margin-bottom:6px}
.mini{height:6px;border-radius:6px;background:rgba(127,127,127,.2);overflow:hidden;margin-top:10px}
.mini i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--brand2),var(--ok))}

.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{border-radius:var(--radius);padding:14px;color:#fff;box-shadow:var(--shadow);animation:rise .4s ease both}
.kpi b{display:block;font-size:24px;letter-spacing:-.4px}
.kpi span{font-size:12px;opacity:.9}
.k1{background:linear-gradient(135deg,#2b6cff,#5b8cff)}
.k2{background:linear-gradient(135deg,#19c3b0,#12a58f)}
.k3{background:linear-gradient(135deg,#7c4dff,#a07bff)}
.k4{background:linear-gradient(135deg,#f0a020,#ff7a45)}
.bars{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:18px}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.bcol .v{font-size:10.5px;color:var(--hint);margin-bottom:3px;white-space:nowrap}
.bcol .b{width:100%;max-width:38px;border-radius:9px 9px 3px 3px;background:linear-gradient(180deg,var(--brand2),var(--brand1));transform-origin:bottom;animation:grow .7s cubic-bezier(.2,.8,.2,1) both}
.bcol .l{font-size:11px;margin-top:5px;color:var(--hint)}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.hbar{margin:9px 0}
.hbar .top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.hbar .track{height:10px;border-radius:8px;background:rgba(127,127,127,.18);overflow:hidden}
.hbar .fill{height:100%;border-radius:8px;transform-origin:left;animation:growx .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.donutwrap{display:flex;align-items:center;gap:18px}
.donut{position:relative;width:128px;height:128px;flex:none}
.donut svg{transform:rotate(-90deg)}
.donut .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut .mid b{font-size:22px}
.legend div{display:flex;align-items:center;gap:8px;font-size:13px;margin:5px 0}
.legend i{width:11px;height:11px;border-radius:4px;display:inline-block}

.achs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.ach{border-radius:var(--radius);padding:12px;background:var(--card);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:3px;min-height:128px}
.ach .ic{font-size:30px;line-height:1.1}
.ach b{font-size:14px}
.ach .d{font-size:11.5px;color:var(--hint);line-height:1.3}
.ach.got{background:linear-gradient(135deg,rgba(43,108,255,.2),rgba(25,195,176,.22));outline:1.5px solid rgba(25,195,176,.55)}
.ach.got .when{font-size:11px;color:var(--ok);font-weight:600;margin-top:auto}
.ach.locked .ic{filter:grayscale(1);opacity:.5}
.ach.locked b{opacity:.75}
.ach .pg{margin-top:auto}
.ach .pg .mini{margin-top:6px}
.ach .pg small{font-size:11px;color:var(--hint)}

.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 4px}
.fbox{background:var(--card);border-radius:14px;padding:10px 6px;text-align:center}
.fbox b{display:block;font-size:17px}
.fbox span{font-size:11px;color:var(--hint)}
.prev{margin-top:12px;padding:12px;border-radius:12px;font-size:14px;background:linear-gradient(135deg,rgba(34,168,103,.16),rgba(25,195,176,.16))}
.prev small{display:block;color:var(--hint);margin-top:4px;font-size:12px;line-height:1.4}
.hist{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid rgba(127,127,127,.15);font-size:13.5px}
.hist:last-child{border-bottom:0}
.warnbox{margin-top:10px;padding:10px 12px;border-radius:12px;font-size:13.5px;line-height:1.45;background:rgba(240,160,32,.16);border:1.5px solid rgba(240,160,32,.6);display:none}
.warnbox.show{display:block}

.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-140%);z-index:60;max-width:90%;
  padding:12px 18px;border-radius:16px;color:#fff;font-weight:600;font-size:14px;text-align:center;
  background:linear-gradient(135deg,var(--brand1),var(--brand3),var(--brand2));box-shadow:0 10px 30px rgba(43,108,255,.5);
  transition:transform .5s cubic-bezier(.2,1.2,.3,1)}
.toast.show{transform:translate(-50%,0)}

.overlay{position:fixed;inset:0;background:rgba(10,15,30,.5);opacity:0;pointer-events:none;transition:.25s;z-index:40}
.overlay.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow-y:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);z-index:41}
.sheet.show{transform:none}
.grab{width:42px;height:5px;border-radius:5px;background:var(--hint);opacity:.4;margin:4px auto 12px}
.sheet h3{margin:0 0 8px;font-size:19px}
label{display:block;font-size:12px;color:var(--hint);margin:10px 2px 2px}
input,select,textarea{width:100%;padding:12px;border-radius:12px;border:1.5px solid rgba(127,127,127,.25);background:var(--card);color:var(--text);font-size:16px;outline:none;font-family:inherit}
textarea{min-height:90px;resize:vertical;font-size:13px}
input:focus,select:focus,textarea:focus{border-color:var(--brand1)}
input:disabled{opacity:.45}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;align-items:center;gap:12px;margin-top:14px;padding:12px;border-radius:12px;background:var(--card);font-size:15px}
.chk input{width:22px;height:22px;flex:none;accent-color:var(--trial)}
.calc{font-size:12.5px;color:var(--hint);margin:4px 2px 0}
</style>
</head>
<body>

<button class="gear" id="gear">⚙</button>
<div class="toast" id="toast"></div>

<div class="hero">
  <div class="hero-top">
    <img src="logo.png" alt="" onerror="this.style.display='none'">
    <div><h1>Трекер репетитора</h1><small id="hello">Добро пожаловать</small></div>
  </div>
  <div class="sync" id="sync">☁ загрузка…</div>
  <div class="hero-sum">
    <div class="sub">Доход в этом месяце</div>
    <div class="big" id="heroIncome">0</div>
    <div class="goalbar"><i id="goalFill"></i></div>
    <div class="sub" id="heroSub"></div>
  </div>
</div>

<main id="view"></main>
<button class="fab" id="fab">+</button>

<nav class="tabs" id="tabs">
  <button data-tab="lessons" class="active"><span>📅</span>Занятия</button>
  <button data-tab="students"><span>🎓</span>Ученики</button>
  <button data-tab="totals"><span>💰</span>Итоги</button>
  <button data-tab="stats"><span>📊</span>Статистика</button>
</nav>

<div class="overlay" id="overlay"></div>
<div class="sheet" id="sheet"></div>

<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) {
  tg.ready(); tg.expand();
  try { tg.setHeaderColor && tg.setHeaderColor('secondary_bg_color'); } catch (e) {}
}
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
const haptic = (t = 'light') => { try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred(t); } catch (e) {} };
const hapticOk = () => { try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred('success'); } catch (e) {} };
const hapticWarn = () => { try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred('warning'); } catch (e) {} };

/* ===== Слой хранения (для варианта Б заменить этот блок) ===== */
const Storage = (() => {
  const CHUNK = 1800, P = 'db';
  const hasCloud = !!(tg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9'));
  const tgUser = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
  const CK = 'db_cache' + (tgUser ? '_' + tgUser.id : '');
  const cloud = {
    get: keys => new Promise((res, rej) => tg.CloudStorage.getItems(keys, (e, v) => e ? rej(e) : res(v))),
    set: (k, v) => new Promise((res, rej) => tg.CloudStorage.setItem(k, v, (e, ok) => e ? rej(e) : res(ok))),
    del: keys => new Promise((res, rej) => tg.CloudStorage.removeItems(keys, (e, ok) => e ? rej(e) : res(ok)))
  };
  let last = [];
  const cacheGet = () => { try { return JSON.parse(localStorage.getItem(CK)); } catch { return null; } };
  const cacheSet = d => { try { localStorage.setItem(CK, JSON.stringify(d)); } catch {} };
  async function loadCloud() {
    if (!hasCloud) return null;
    const meta = await cloud.get([P + ':n']);
    const n = parseInt(meta[P + ':n'] || '0', 10);
    if (!n) return null;
    const keys = Array.from({length: n}, (_, i) => `${P}:${i}`);
    const parts = await cloud.get(keys);
    last = keys.map(k => parts[k] || '');
    return JSON.parse(last.join(''));
  }
  async function saveCloud(data) {
    if (!hasCloud) return;
    const json = JSON.stringify(data), chunks = [];
    for (let i = 0; i < json.length; i += CHUNK) chunks.push(json.slice(i, i + CHUNK));
    const jobs = [];
    chunks.forEach((c, i) => { if (last[i] !== c) jobs.push(cloud.set(`${P}:${i}`, c)); });
    await Promise.all(jobs);
    if (chunks.length !== last.length) await cloud.set(P + ':n', String(chunks.length));
    if (last.length > chunks.length) {
      await cloud.del(Array.from({length: last.length - chunks.length}, (_, i) => `${P}:${chunks.length + i}`));
    }
    last = chunks;
  }
  return {hasCloud, cacheGet, cacheSet, loadCloud, saveCloud};
})();

/* ===== Состояние и утилиты ===== */
let db = {students: [], lessons: [], goal: 0, ach: {}};
let tab = 'lessons', lessonFilter = 'all', period = 'all', lessonLimit = 50, selDay = null, weekOff = 0, ready = false;
let statsMode = 'overview', selMonth = null;
const $ = id => document.getElementById(id);
const view = $('view');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const money = n => (Math.round(n * 100) / 100).toLocaleString('ru-RU');
const cents = n => Math.round((Number(n) || 0) * 100);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const stu = id => db.students.find(s => s.id === id);
const lessonById = id => db.lessons.find(x => x.id === id);
const hours = l => (l.duration || 60) / 60;
const hasCustom = l => !l.trial && typeof l.price === 'number';
const sum = l => l.trial ? 0 : (hasCustom(l) ? l.price : l.rate * hours(l));
const isMoved = l => l.status === 'cancel' && !!l.movedTo && !!lessonById(l.movedTo);
const fmtDate = d => d.split('-').reverse().join('.');
const p2 = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}`;
const todayStr = () => ymd(new Date());
const PALETTE = [['#2b6cff','#5b8cff'],['#19c3b0','#12a58f'],['#7c4dff','#a07bff'],['#f0a020','#ff7a45'],['#e5484d','#ff7b80'],['#0ea5e9','#38bdf8'],['#22a867','#4ade80']];
const colorOf = id => { let h = 0; for (const c of id) h = (h * 31 + c.charCodeAt(0)) >>> 0; return PALETTE[h % PALETTE.length]; };
const avatar = s => { const [a, b] = colorOf(s.id); return `<div class="avatar" style="background:linear-gradient(135deg,${a},${b})">${esc((s.name || '?').trim()[0]?.toUpperCase())}</div>`; };
const alertMsg = m => tg && tg.showAlert ? tg.showAlert(m) : alert(m);
const confirmDlg = (m, cb) => tg && tg.showConfirm ? tg.showConfirm(m, ok => ok && cb()) : (confirm(m) && cb());

/* ===== Защита от накладок ===== */
const toMin = t => { const [h, m] = String(t || '0:0').split(':'); return (parseInt(h, 10) || 0) * 60 + (parseInt(m, 10) || 0); };
const fmtRange = x => { const s = toMin(x.time), e = s + (x.duration || 60); return `${x.time}–${p2(Math.floor(e / 60) % 24)}:${p2(e % 60)}`; };
function findConflicts(date, time, dur, excludeId) {
  const s = toMin(time), e = s + (dur || 0);
  return db.lessons
    .filter(x => x.id !== excludeId && x.date === date && x.status !== 'cancel')
    .filter(x => { const xs = toMin(x.time), xe = xs + (x.duration || 60); return s < xe && xs < e; })
    .sort((a, b) => a.time.localeCompare(b.time));
}
const conflictLines = list => list.map(x => `${fmtRange(x)} · ${stu(x.studentId)?.name || '—'}`);

/* ===== Индикатор синхронизации ===== */
const SYNC = {pending: '☁ сохраняю…', saving: '☁ сохраняю…', saved: '☁ сохранено', local: '💾 хранится на устройстве', error: '⚠ нет связи, повторю'};
const setSync = k => { const e = $('sync'); if (e) e.textContent = SYNC[k]; };

/* ===== Быстрое сохранение ===== */
let saveTimer = null, saving = false, dirty = false;
async function flush() {
  clearTimeout(saveTimer);
  if (saving) { saveTimer = setTimeout(flush, 300); return; }
  if (!dirty) return;
  saving = true; dirty = false; setSync('saving');
  try { await Storage.saveCloud(db); if (!dirty) setSync(Storage.hasCloud ? 'saved' : 'local'); }
  catch (e) { dirty = true; setSync('error'); console.error(e); }
  saving = false;
  if (dirty) saveTimer = setTimeout(flush, 2000);
}
function persist() {
  db.updated = Date.now();
  Storage.cacheSet(db);
  dirty = true; setSync('pending');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 400);
  return Promise.resolve();
}
document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); });
window.addEventListener('pagehide', flush);

const weekKey = dateStr => {
  const d = new Date(dateStr + 'T00:00'); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return ymd(d);
};
function achStats() {
  const done = db.lessons.filter(l => l.status === 'done');
  const pay = done.filter(l => !l.trial);
  const paid = pay.filter(l => l.paid);
  const curM = todayStr().slice(0, 7);
  const byM = {};
  pay.forEach(l => { const m = l.date.slice(0, 7); const o = byM[m] = byM[m] || {n: 0, unpaid: 0, inc: 0}; o.n++; if (l.paid) o.inc += sum(l); else o.unpaid++; });
  const cleanMonths = Object.keys(byM).filter(m => m < curM && byM[m].n >= 4 && byM[m].unpaid === 0).length;
  const goalHit = db.goal > 0 && Object.values(byM).some(o => o.inc >= db.goal);
  const seq = db.lessons.filter(l => (l.status === 'done' || l.status === 'cancel') && !isMoved(l)).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  let run = 0, streak = 0; seq.forEach(l => { run = l.status === 'done' ? run + 1 : 0; streak = Math.max(streak, run); });
  const wk = {}; done.forEach(l => { const k = weekKey(l.date); wk[k] = (wk[k] || 0) + 1; });
  return {
    doneN: done.length, hours: done.reduce((a, l) => a + hours(l), 0), paidN: paid.length,
    income: paid.reduce((a, l) => a + sum(l), 0), students: db.students.length,
    cleanMonths, goalHit, streak, maxWeek: Math.max(0, ...Object.values(wk))
  };
}

  if (!ready) return;

  ACH.forEach(a => { if (!db.ach[a.id] && a.cur(s) >= a.target) { db.ach[a.id] = todayStr(); fresh.push(a); } });
  if (fresh.length) {

    toast(fresh.length === 1 ? `🏆 Достижение: ${fresh[0].title}` : `🏆 Новые достижения: ${fresh.length}`);

/* ===== Средства ученика: оплата от самых старых занятий к новым ===== */
function unpaidQueue(st) {
  return db.lessons
    .filter(l => l.studentId === st.id && l.status === 'done' && !l.trial && !l.paid && cents(sum(l)) > 0)
    .sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
}
function planPayment(st, amount) {
  const total = cents(st.balance) + cents(amount);
  let left = total;
  const pay = [];
  for (const l of unpaidQueue(st)) {
    const c = cents(sum(l));
    if (left >= c) { pay.push(l); left -= c; } else break;
  }
  return {pay, left: left / 100, total: total / 100};
}

function openFundsSheet(studentId) {
  const st = stu(studentId); if (!st) return;
  const q = unpaidQueue(st);
  const debt = q.reduce((a, l) => a + cents(sum(l)), 0) / 100;
  const hist = (st.payments || []).slice(-5).reverse();
  openSheet(`<h3>💵 Средства — ${esc(st.name)}</h3>
    <div class="fgrid">
      <div class="fbox"><b style="color:var(--ok)">${money(st.balance || 0)}</b><span>аванс</span></div>
      <div class="fbox"><b style="color:${debt ? 'var(--warn)' : 'var(--ok)'}">${money(debt)}</b><span>долг</span></div>
      <div class="fbox"><b>${q.length}</b><span>неоплачено зан.</span></div>
    </div>
    <label>Сумма, которую внёс ученик</label>
    <input id="f-amount" type="number" inputmode="decimal" placeholder="Например, 100">
    <div class="prev" id="f-prev"></div>
    <div style="height:12px"></div>
    <button class="btn" id="f-apply">Внести и распределить</button>
    ${hist.length ? `<h3 style="margin-top:22px;font-size:16px">История платежей</h3>
      ${hist.map(p => `<div class="hist"><span>${fmtDate(p.date)}</span><span><b>+${money(p.amount)}</b> · оплачено ${p.ids.length} зан.</span></div>`).join('')}
      <div style="height:10px"></div><button class="btn ghost" id="f-undo">Отменить последний платёж</button>` : ''}`);
  const update = () => {
    const raw = val('f-amount').trim(), amount = raw === '' ? 0 : parseFloat(raw);
    const bad = isNaN(amount) || amount < 0;
    const plan = planPayment(st, bad ? 0 : amount);
    const prev = $('f-prev'), btn = $('f-apply');
    if (bad) { prev.innerHTML = 'Введите сумму числом, не меньше нуля'; btn.disabled = true; return; }
    const hasBal = cents(st.balance) > 0;
    btn.disabled = amount === 0 && !hasBal;
    const spent = plan.total - plan.left;
    const list = plan.pay.slice(0, 6).map(l => `${fmtDate(l.date)} (${money(sum(l))})`).join(', ') + (plan.pay.length > 6 ? ` и ещё ${plan.pay.length - 6}` : '');
    prev.innerHTML = `<b>Будет оплачено: ${plan.pay.length} зан. на ${money(spent)}</b>
      <div>Остаток в аванс: <b>${money(plan.left)}</b>${hasBal ? ` <span class="hint">(с учётом аванса ${money(st.balance)})</span>` : ''}</div>
      <small>${plan.pay.length ? 'Порядок: от самых старых к новым — ' + list : (q.length ? 'Денег пока не хватает на самое старое занятие, сумма уйдёт в аванс.' : 'Неоплаченных занятий нет, сумма уйдёт в аванс.')}</small>`;
  };
  $('f-amount').addEventListener('input', update);
  update();
  $('f-apply').onclick = async () => {
    const raw = val('f-amount').trim(), amount = raw === '' ? 0 : parseFloat(raw);
    if (isNaN(amount) || amount < 0) return alertMsg('Введите сумму числом');
    const plan = planPayment(st, amount);
    if (amount === 0 && cents(st.balance) === 0) return;
    const rec = {id: uid(), date: todayStr(), amount, ids: plan.pay.map(l => l.id), balBefore: st.balance || 0, balAfter: plan.left};
    plan.pay.forEach(l => { l.paid = true; });
    st.balance = plan.left;
    st.payments = (st.payments || []).concat(rec).slice(-20);
    haptic('medium'); closeSheet();
    toast(`✔ Оплачено ${plan.pay.length} зан. · аванс ${money(plan.left)}`);
    await persist(); render();
  };
  const undo = $('f-undo');
  if (undo) undo.onclick = () => confirmDlg('Отменить последний платёж? Занятия снова станут неоплаченными.', async () => {
    const last = (st.payments || []).pop(); if (!last) return;
    last.ids.forEach(id => { const l = lessonById(id); if (l) l.paid = false; });
    st.balance = last.balBefore || 0;
    closeSheet(); toast('Платёж отменён'); await persist(); render();
  });
}

  const s = stu(l.studentId) || {name: '—'};
  const tmr = new Date(); tmr.setDate(tmr.getDate() + 1);

    <div class="hint" style="margin-top:10px">${l.status === 'cancel' ? 'Исходное занятие останется отменённым с пометкой «перенесено».' : 'Исходное занятие будет отменено с пометкой «перенесено».'} Ученик, тема и цена сохранятся.</div>
    <div style="height:12px"></div><button class="btn" id="m-save">Перенести</button>`);
  const updateWarn = () => {
    const c = findConflicts(val('m-date'), val('m-time'), parseInt(val('m-dur'), 10) || 0, l.id), w = $('m-warn');
    if (c.length) { w.innerHTML = '⚠ <b>Накладка по времени.</b> Пересекается с:<br>' + conflictLines(c).map(esc).join('<br>'); w.classList.add('show'); }
    else { w.innerHTML = ''; w.classList.remove('show'); }
  };
  ['m-date', 'm-time', 'm-dur'].forEach(i => { $(i).addEventListener('input', updateWarn); $(i).addEventListener('change', updateWarn); });
  updateWarn();
  $('m-save').onclick = () => {
    const date = val('m-date'), time = val('m-time'), duration = parseInt(val('m-dur'), 10);
    if (!date || !time || !duration) return alertMsg('Заполните дату, время и длительность');
    if (date === l.date && time === l.time && duration === l.duration) return alertMsg('Выберите другую дату или время');
    const proceed = async () => {
      const nl = {id: uid(), studentId: l.studentId, date, time, duration, topic: l.topic || '', status: 'planned',
        trial: !!l.trial, price: typeof l.price === 'number' ? l.price : null, paid: false, rate: l.rate, movedFrom: l.id};
      if (l.status !== 'cancel') { l.status = 'cancel'; l.paid = false; }
      l.movedTo = nl.id;
      db.lessons.push(nl);
      haptic('medium'); closeSheet();
      toast(`↻ Перенесено на ${fmtDate(date)} в ${time}`);
      selDay = null; await persist(); render();
    };
    const conflicts = findConflicts(date, time, duration, l.id);
    if (conflicts.length) {
      hapticWarn();
      confirmDlg(`Новое время пересекается:\n${conflictLines(conflicts).join('\n')}\n\nВсё равно перенести?`, proceed);
    } else proceed();
  };
}

function weekStrip() {
  const t = new Date(todayStr() + 'T00:00');
  t.setDate(t.getDate() - ((t.getDay() + 6) % 7) + weekOff * 7);
  const names = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'], now = todayStr();
  let h = '';
  for (let i = 0; i < 7; i++) {
    const d = new Date(t); d.setDate(t.getDate() + i);
    const s = ymd(d), n = db.lessons.filter(l => l.date === s && l.status !== 'cancel').length;
    h += `<button class="wdb ${s === now ? 'today' : ''} ${s === selDay ? 'sel' : ''}" data-day="${s}"><small>${names[i]}</small><b>${d.getDate()}</b><i class="${n ? 'dot' : ''}">${n || ''}</i></button>`;
  }
  const label = t.toLocaleDateString('ru-RU', {month: 'long', year: 'numeric'});
  return `<div class="card wk"><div class="row"><button class="nav" data-wk="-1">‹</button><b style="text-transform:capitalize">${label}</b><button class="nav" data-wk="1">›</button></div><div class="wkrow">${h}</div></div>`;
}

function todayCard(now) {
  const td = db.lessons.filter(l => l.date === now && l.status !== 'cancel').sort((a, b) => a.time.localeCompare(b.time));
  const nowT = new Date().toTimeString().slice(0, 5);
  const next = td.find(l => l.time >= nowT);
  let txt;
  if (!td.length) txt = '<b>Сегодня свободно</b><div class="hint">Занятий не запланировано</div>';
  else txt = `<b>Сегодня: ${td.length} ${td.length === 1 ? 'занятие' : 'занятий'}</b><div class="hint">${next ? `Ближайшее в ${esc(next.time)} · ${esc(stu(next.studentId)?.name || '—')}` : 'Все на сегодня уже позади'}</div>`;
  return `<div class="card today"><div class="ico">${td.length ? '🔔' : '☕'}</div><div>${txt}</div></div>`;
}

/* ===== Статистика по месяцам ===== */
const shiftMonth = (m, d) => { const [y, mo] = m.split('-').map(Number); const dt = new Date(y, mo - 1 + d, 1); return `${dt.getFullYear()}-${p2(dt.getMonth() + 1)}`; };
const monthName = m => new Date(m + '-01T00:00').toLocaleDateString('ru-RU', {month: 'long', year: 'numeric'});
function monthStats(m) {
  const ls = db.lessons.filter(l => l.date.startsWith(m));
  const done = ls.filter(l => l.status === 'done'), planned = ls.filter(l => l.status === 'planned');
  const moved = ls.filter(l => isMoved(l)), canc = ls.filter(l => l.status === 'cancel' && !isMoved(l));
  const trials = done.filter(l => l.trial), pay = done.filter(l => !l.trial);
  const paid = pay.filter(l => l.paid), unpaid = pay.filter(l => !l.paid);
  const income = paid.reduce((s, l) => s + sum(l), 0), accrued = pay.reduce((s, l) => s + sum(l), 0), debt = unpaid.reduce((s, l) => s + sum(l), 0);
  return {ls, done, planned, moved, canc, trials, pay, paid, unpaid, income, accrued, debt,
    hrs: done.reduce((s, l) => s + hours(l), 0), n: done.length,
    avg: pay.length ? accrued / pay.length : 0,
    paidRate: pay.length ? Math.round(paid.length / pay.length * 100) : 0,
    cancelRate: done.length + canc.length ? Math.round(canc.length / (done.length + canc.length) * 100) : 0};
}
function delta(cur, prev) {
  if (!prev) return cur ? '<span class="dl">новое</span>' : '';
  const p = Math.round((cur - prev) / prev * 100);
  if (p === 0) return '<span class="dl">0%</span>';
  return `<span class="dl">${p > 0 ? '▲' : '▼'} ${Math.abs(p)}%</span>`;
}
function deltaPlain(cur, prev) {
  if (!prev) return '';
  const p = Math.round((cur - prev) / prev * 100);
  if (p === 0) return '<span class="dlt">0%</span>';
  return `<span class="dlt ${p > 0 ? 'up' : 'down'}">${p > 0 ? '▲' : '▼'} ${Math.abs(p)}%</span>`;
}

      return `<button class="mrow ${k === m ? 'sel' : ''}" data-mpick="${k}">
        <div class="row"><span class="nm">${monthName(k)}</span><b>${money(x.income)} ${deltaPlain(x.income, pv.income)}</b></div>
        <div class="hint">${x.n} зан. · ${money(x.hrs)} ч${x.debt ? ` · долг ${money(x.debt)}` : ''}</div>
        <div class="mini"><i style="width:${x.income / maxInc * 100}%"></i></div></button>`; }).join('')}`;
  bindSeg();
  view.querySelectorAll('[data-mm]').forEach(b => b.onclick = () => { selMonth = shiftMonth(selMonth, parseInt(b.dataset.mm, 10)); haptic(); render(); });
  const mc = view.querySelector('[data-mcur]'); if (mc) mc.onclick = () => { selMonth = cur; haptic(); render(); };
  view.querySelectorAll('[data-mpick]').forEach(b => b.onclick = () => { selMonth = b.dataset.mpick; haptic(); window.scrollTo({top: 0, behavior: 'smooth'}); render(); });
}

/* ===== Выезжающее окно ===== */
const sheet = $('sheet'), overlay = $('overlay');
const openSheet = html => { sheet.innerHTML = '<div class="grab"></div>' + html; overlay.classList.add('show'); sheet.classList.add('show'); sheet.scrollTop = 0; };
const closeSheet = () => { overlay.classList.remove('show'); sheet.classList.remove('show'); };
overlay.onclick = closeSheet;
const val = id => $(id).value;

function openStudentSheet(s) {
  openSheet(`<h3>${s ? 'Редактировать ученика' : 'Новый ученик'}</h3>
    <label>Имя</label><input id="s-name" placeholder="Например, Анна" value="${esc(s?.name)}">
    <label>Предмет</label><input id="s-subj" placeholder="Математика" value="${esc(s?.subject)}">
    <label>Ставка за час</label><input id="s-rate" type="number" inputmode="decimal" placeholder="25" value="${esc(s?.rate)}">
    <div style="height:14px"></div><button class="btn" id="s-save">${s ? 'Сохранить' : 'Добавить'}</button>`);
  $('s-save').onclick = async () => {
    const name = val('s-name').trim(), subject = val('s-subj').trim(), rate = parseFloat(val('s-rate'));
    if (!name || isNaN(rate)) return alertMsg('Укажите имя и ставку');
    if (s) Object.assign(stu(s.id), {name, subject, rate}); else db.students.push({id: uid(), name, subject, rate, balance: 0, payments: []});
    haptic('medium'); closeSheet(); await persist(); render();
  };
}

function openLessonSheet(l) {
  if (!db.students.length) return alertMsg('Сначала добавьте ученика');
  const now = new Date(), nextH = p2((now.getHours() + 1) % 24) + ':00';
  openSheet(`<h3>${l ? 'Редактировать занятие' : 'Новое занятие'}</h3>
    <label>Ученик</label><select id="l-stu">${db.students.map(s => `<option value="${s.id}" ${l?.studentId === s.id ? 'selected' : ''}>${esc(s.name)}${s.subject ? ' — ' + esc(s.subject) : ''}</option>`).join('')}</select>
    <div class="two"><div><label>Дата</label><input id="l-date" type="date" value="${l?.date || selDay || todayStr()}"></div>
    <div><label>Время</label><input id="l-time" type="time" value="${l?.time || nextH}"></div></div>
    <div class="two"><div><label>Длительность, мин</label><input id="l-dur" type="number" inputmode="numeric" value="${l?.duration || 60}"></div>
    <div><label>Статус</label><select id="l-status">${Object.entries(statusName).map(([k, t]) => `<option value="${k}" ${(l?.status || '') === k ? 'selected' : ''}>${t[0].toUpperCase() + t.slice(1)}</option>`).join('')}</select></div></div>
    <div class="warnbox" id="l-warn"></div>
    <label>Тема</label><input id="l-topic" placeholder="Квадратные уравнения" value="${esc(l?.topic)}">
    <label>Своя цена за занятие (необязательно)</label>
    <input id="l-price" type="number" inputmode="decimal" placeholder="Оставьте пустым — по ставке ученика" value="${typeof l?.price === 'number' ? l.price : ''}">
    <div class="calc" id="l-calc"></div>
    <label class="chk" for="l-trial"><input id="l-trial" type="checkbox" ${l?.trial ? 'checked' : ''}><span>🎁 Пробное занятие (бесплатно)</span></label>
    <div style="height:14px"></div><button class="btn" id="l-save">${l ? 'Сохранить' : 'Добавить'}</button>`);
  if (!l) $('l-status').value = 'planned';
  const currentConflicts = () => val('l-status') === 'cancel' ? [] : findConflicts(val('l-date'), val('l-time'), parseInt(val('l-dur'), 10) || 0, l?.id);
  const updateWarn = () => {
    const c = currentConflicts(), w = $('l-warn');
    if (c.length) { w.innerHTML = '⚠ <b>Накладка по времени.</b> Пересекается с:<br>' + conflictLines(c).map(esc).join('<br>'); w.classList.add('show'); }
    else { w.innerHTML = ''; w.classList.remove('show'); }
  };
  const updateCalc = () => {
    const st = stu(val('l-stu')); if (!st) return;
    const rate = l && l.studentId === st.id ? l.rate : st.rate;
    const dur = parseInt(val('l-dur'), 10) || 0;
    const trial = $('l-trial').checked;
    $('l-price').disabled = trial;
    $('l-calc').textContent = trial ? 'Занятие бесплатное: стоимость 0, в долги не попадёт' : `По ставке: ${money(rate * dur / 60)} (${money(rate)} за час)`;
  };
  ['l-stu', 'l-dur', 'l-trial'].forEach(id => $(id).addEventListener('input', updateCalc));
  $('l-trial').addEventListener('change', updateCalc);
  ['l-date', 'l-time', 'l-dur', 'l-status'].forEach(id => { $(id).addEventListener('input', updateWarn); $(id).addEventListener('change', updateWarn); });
  updateCalc(); updateWarn();
  $('l-save').onclick = () => {
    const studentId = val('l-stu'), date = val('l-date'), time = val('l-time'), duration = parseInt(val('l-dur'), 10), topic = val('l-topic').trim(), status = val('l-status');
    const trial = $('l-trial').checked, priceRaw = val('l-price').trim(), priceNum = parseFloat(priceRaw);
    if (!date || !time || !duration) return alertMsg('Заполните дату, время и длительность');
    if (priceRaw !== '' && (isNaN(priceNum) || priceNum < 0)) return alertMsg('Цена должна быть числом от нуля');
    const price = !trial && priceRaw !== '' ? priceNum : null;
    const proceed = async () => {
      if (l) {
        const x = lessonById(l.id);
        const wasTrial = !!x.trial;
        if (x.studentId !== studentId) x.rate = stu(studentId).rate;
        Object.assign(x, {studentId, date, time, duration, topic, status, trial, price});
        if (status !== 'done') x.paid = false;
        else if (trial) x.paid = true;
        else if (wasTrial) x.paid = false;
      } else {
        db.lessons.push({id: uid(), studentId, date, time, duration, topic, status, trial, price, paid: trial && status === 'done', rate: stu(studentId).rate});
      }
      haptic('medium'); closeSheet(); await persist(); render();
    };
    const conflicts = status === 'cancel' ? [] : findConflicts(date, time, duration, l?.id);
    if (conflicts.length) {
      hapticWarn();
      confirmDlg(`Занятие пересекается по времени:\n${conflictLines(conflicts).join('\n')}\n\nВсё равно сохранить?`, proceed);
    } else proceed();
  };
}

function openSettings() {
  openSheet(`<h3>Цель и данные</h3>
    <label>Цель по доходу на месяц</label>
    <input id="g-goal" type="number" inputmode="decimal" placeholder="Например, 1500" value="${db.goal || ''}">
    <div style="height:10px"></div><button class="btn" id="g-save">Сохранить цель</button>
    <h3 style="margin-top:24px">Резервная копия</h3>
    <div class="hint">Данные хранятся в вашем аккаунте Telegram и доступны на всех ваших устройствах. Копия нужна на всякий случай.</div>
    <div style="height:10px"></div><button class="btn ghost" id="g-exp">Скопировать копию данных</button>
    <label>Восстановить из копии: вставьте текст сюда</label>
    <textarea id="g-imp" placeholder="Вставьте скопированный текст"></textarea>
    <div style="height:10px"></div><button class="btn ghost" id="g-impbtn">Восстановить данные</button>
    <div style="height:18px"></div><button class="btn danger" id="g-clear">Удалить все данные</button>`);
  $('g-save').onclick = async () => { db.goal = Math.max(0, parseFloat(val('g-goal')) || 0); haptic('medium'); closeSheet(); await persist(); render(); };
  $('g-exp').onclick = async () => {
    const txt = JSON.stringify(db);
    try { await navigator.clipboard.writeText(txt); alertMsg('Копия данных скопирована в буфер обмена. Вставьте её в «Избранное» в Telegram.'); }
    catch (e) { $('g-imp').value = txt; $('g-imp').select(); alertMsg('Скопируйте текст из поля ниже вручную.'); }
  };
  $('g-impbtn').onclick = () => {
    let obj; try { obj = JSON.parse(val('g-imp')); } catch (e) { return alertMsg('Не удалось прочитать данные. Вставьте текст копии целиком.'); }
    if (!obj || !Array.isArray(obj.students) || !Array.isArray(obj.lessons)) return alertMsg('Это не похоже на копию трекера.');
    confirmDlg('Заменить текущие данные данными из копии?', async () => { db = obj; closeSheet(); await persist(); render(); });
  };
  $('g-clear').onclick = () => confirmDlg('Удалить всех учеников и все занятия? Это нельзя отменить.', async () => { db = {students: [], lessons: [], goal: 0, ach: {}}; closeSheet(); await persist(); render(); });
}

$('gear').onclick = () => { haptic(); openSettings(); };
$('fab').onclick = () => { haptic(); tab === 'students' ? openStudentSheet() : openLessonSheet(); };
$('tabs').querySelectorAll('button').forEach(b => b.onclick = () => { tab = b.dataset.tab; haptic(); window.scrollTo({top: 0, behavior: 'smooth'}); render(); });

/* ===== Старт ===== */
(async () => {
  const cached = Storage.cacheGet();
  if (cached) db = cached;
  setSync(Storage.hasCloud ? 'saved' : 'local');
  render();
  setTimeout(() => document.body.classList.add('noanim'), 700);
  try {
    const cl = await Storage.loadCloud();
    if (cl && (!cached || (cl.updated || 0) > (cached.updated || 0)) && !dirty) {
      db = cl; Storage.cacheSet(db);
    } else if (cached && (!cl || (cached.updated || 0) > (cl.updated || 0))) {
      dirty = true; flush();
    }
  } catch (e) { console.error(e); setSync('error'); }
  ready = true;
  render();
})();
</script>
</body>
</html>
