<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Трекер репетитора</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:var(--tg-theme-bg-color,#fff);--text:var(--tg-theme-text-color,#111);
  --hint:var(--tg-theme-hint-color,#888);--btn:var(--tg-theme-button-color,#1a8cff);
  --btn-text:var(--tg-theme-button-text-color,#fff);
  --card:var(--tg-theme-secondary-bg-color,#f1f3f6);
  --ok:#2e9e5b;--bad:#d9534f;--warn:#e8a317;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:15px/1.4 -apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);padding-bottom:70px}
header{display:flex;align-items:center;gap:10px;padding:12px 14px}
header img{width:40px;height:40px;border-radius:10px}
header h1{font-size:18px;margin:0}
main{padding:0 14px}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid #0001}
.tabs button{flex:1;padding:12px 4px;border:0;background:none;color:var(--hint);font-size:13px}
.tabs button.active{color:var(--btn);font-weight:600}
.card{background:var(--card);border-radius:12px;padding:12px;margin:10px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hint{color:var(--hint);font-size:13px}
input,select{width:100%;padding:10px;margin:4px 0;border-radius:8px;border:1px solid #0002;background:var(--bg);color:var(--text);font-size:15px}
.btn{background:var(--btn);color:var(--btn-text);border:0;border-radius:10px;padding:11px 14px;font-size:15px;width:100%;margin-top:6px}
.btn.small{width:auto;padding:6px 10px;font-size:13px;margin:0}
.btn.ghost{background:none;color:var(--btn);border:1px solid var(--btn)}
.btn.danger{background:var(--bad)}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:12px;color:#fff}
.done{background:var(--ok)}.cancel{background:var(--hint)}.unpaid{background:var(--warn)}.paid{background:var(--btn)}
.stat{display:flex;gap:10px}.stat .card{flex:1;text-align:center;margin:10px 0}
.stat b{font-size:20px;display:block}
h2{font-size:16px;margin:18px 0 4px}
.hidden{display:none}
.actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.empty{text-align:center;color:var(--hint);padding:24px}
</style>
</head>
<body>
<header>
  <img src="logo.png" alt="" onerror="this.style.display='none'">
  <h1>Трекер репетитора</h1>
</header>
<main id="view"></main>
<nav class="tabs">
  <button data-tab="lessons" class="active">📅 Занятия</button>
  <button data-tab="students">👩‍🎓 Ученики</button>
  <button data-tab="stats">📊 Итоги</button>
</nav>

<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }

/* ===== Слой хранения (для варианта Б заменить этот блок) ===== */
const Storage = (() => {
  const CHUNK = 1000, PREFIX = 'db';
  const hasCloud = !!(tg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9'));
  const cloud = {
    get: keys => new Promise((res, rej) => tg.CloudStorage.getItems(keys, (e, v) => e ? rej(e) : res(v))),
    set: (k, v) => new Promise((res, rej) => tg.CloudStorage.setItem(k, v, (e, ok) => e ? rej(e) : res(ok))),
    del: keys => new Promise((res, rej) => tg.CloudStorage.removeItems(keys, (e, ok) => e ? rej(e) : res(ok)))
  };
  async function load() {
    if (!hasCloud) {
      try { return JSON.parse(localStorage.getItem(PREFIX)) || null; } catch { return null; }
    }
    const meta = await cloud.get([PREFIX + ':n']);
    const n = parseInt(meta[PREFIX + ':n'] || '0', 10);
    if (!n) return null;
    const keys = Array.from({length: n}, (_, i) => `${PREFIX}:${i}`);
    const parts = await cloud.get(keys);
    return JSON.parse(keys.map(k => parts[k] || '').join(''));
  }
  async function save(data) {
    const json = JSON.stringify(data);
    if (!hasCloud) { localStorage.setItem(PREFIX, json); return; }
    const oldMeta = await cloud.get([PREFIX + ':n']);
    const oldN = parseInt(oldMeta[PREFIX + ':n'] || '0', 10);
    const chunks = [];
    for (let i = 0; i < json.length; i += CHUNK) chunks.push(json.slice(i, i + CHUNK));
    for (let i = 0; i < chunks.length; i++) await cloud.set(`${PREFIX}:${i}`, chunks[i]);
    await cloud.set(PREFIX + ':n', String(chunks.length));
    if (oldN > chunks.length) {
      await cloud.del(Array.from({length: oldN - chunks.length}, (_, i) => `${PREFIX}:${chunks.length + i}`));
    }
  }
  return {load, save};
})();

/* ===== Состояние ===== */
let db = {students: [], lessons: []};
let tab = 'lessons';
let editing = null;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const money = n => (Math.round(n * 100) / 100).toLocaleString('ru-RU');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const stu = id => db.students.find(s => s.id === id);
const fmtDate = d => d ? d.split('-').reverse().join('.') : '';
const hours = l => (l.duration || 60) / 60;
const persist = async () => {
  try { await Storage.save(db); }
  catch (e) { tg && tg.showAlert ? tg.showAlert('Ошибка сохранения: ' + (e.message || e)) : alert('Ошибка сохранения'); }
};
const confirmDlg = (msg, cb) => tg && tg.showConfirm ? tg.showConfirm(msg, ok => ok && cb()) : (confirm(msg) && cb());

/* ===== Рендер ===== */
const view = document.getElementById('view');
function render() {
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  if (tab === 'students') renderStudents();
  else if (tab === 'lessons') renderLessons();
  else renderStats();
}

function renderStudents() {
  const e = editing && editing.type === 'student' ? editing.data : null;
  view.innerHTML = `
    <div class="card">
      <b>${e && e.id ? 'Редактировать ученика' : 'Новый ученик'}</b>
      <input id="s-name" placeholder="Имя" value="${esc(e?.name)}">
      <input id="s-subj" placeholder="Предмет" value="${esc(e?.subject)}">
      <input id="s-rate" type="number" inputmode="decimal" placeholder="Ставка за час" value="${esc(e?.rate)}">
      <button class="btn" id="s-save">${e && e.id ? 'Сохранить' : 'Добавить'}</button>
      ${e ? '<button class="btn ghost" id="s-cancel">Отмена</button>' : ''}
    </div>
    <h2>Ученики (${db.students.length})</h2>
    ${db.students.length ? db.students.map(s => `
      <div class="card">
        <div class="row"><b>${esc(s.name)}</b><span>${money(s.rate)} / час</span></div>
        <div class="hint">${esc(s.subject)}</div>
        <div class="actions">
          <button class="btn small ghost" data-edit="${s.id}">Изменить</button>
          <button class="btn small danger" data-del="${s.id}">Удалить</button>
        </div>
      </div>`).join('') : '<div class="empty">Пока нет учеников</div>'}`;
  document.getElementById('s-save').onclick = async () => {
    const name = val('s-name').trim(), subject = val('s-subj').trim(), rate = parseFloat(val('s-rate'));
    if (!name || isNaN(rate)) return tg ? tg.showAlert('Укажите имя и ставку') : alert('Укажите имя и ставку');
    if (e && e.id) Object.assign(stu(e.id), {name, subject, rate});
    else db.students.push({id: uid(), name, subject, rate});
    editing = null; await persist(); render();
  };
  const c = document.getElementById('s-cancel'); if (c) c.onclick = () => { editing = null; render(); };
  view.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => { editing = {type: 'student', data: {...stu(b.dataset.edit)}}; render(); window.scrollTo(0, 0); });
  view.querySelectorAll('[data-del]').forEach(b => b.onclick = () => confirmDlg('Удалить ученика и все его занятия?', async () => {
    const id = b.dataset.del;
    db.students = db.students.filter(s => s.id !== id);
    db.lessons = db.lessons.filter(l => l.studentId !== id);
    await persist(); render();
  }));
}

function renderLessons() {
  if (!db.students.length) { view.innerHTML = '<div class="empty">Сначала добавьте ученика на вкладке «Ученики»</div>'; return; }
  const e = editing && editing.type === 'lesson' ? editing.data : null;
  const today = new Date().toISOString().slice(0, 10);
  const sorted = [...db.lessons].sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time));
  view.innerHTML = `
    <div class="card">
      <b>${e && e.id ? 'Редактировать занятие' : 'Новое занятие'}</b>
      <select id="l-stu">${db.students.map(s => `<option value="${s.id}" ${e?.studentId === s.id ? 'selected' : ''}>${esc(s.name)} — ${esc(s.subject)}</option>`).join('')}</select>
      <input id="l-date" type="date" value="${e?.date || today}">
      <input id="l-time" type="time" value="${e?.time || '16:00'}">
      <input id="l-dur" type="number" inputmode="numeric" placeholder="Длительность, мин" value="${e?.duration || 60}">
      <input id="l-topic" placeholder="Тема" value="${esc(e?.topic)}">
      <select id="l-status">
        <option value="done" ${e?.status === 'cancel' ? '' : 'selected'}>Проведено</option>
        <option value="cancel" ${e?.status === 'cancel' ? 'selected' : ''}>Отменено</option>
      </select>
      <button class="btn" id="l-save">${e && e.id ? 'Сохранить' : 'Добавить'}</button>
      ${e ? '<button class="btn ghost" id="l-cancel">Отмена</button>' : ''}
    </div>
    <h2>Расписание (${sorted.length})</h2>
    ${sorted.length ? sorted.map(l => {
      const s = stu(l.studentId);
      return `<div class="card">
        <div class="row"><b>${esc(s?.name || '—')}</b>
          <span class="tag ${l.status === 'done' ? 'done' : 'cancel'}">${l.status === 'done' ? 'проведено' : 'отменено'}</span></div>
        <div class="hint">${fmtDate(l.date)} ${esc(l.time)} · ${l.duration} мин · ${money(l.rate * hours(l))}</div>
        <div>${esc(l.topic)}</div>
        <div class="actions">
          ${l.status === 'done' ? `<button class="btn small ${l.paid ? '' : 'ghost'}" data-pay="${l.id}">${l.paid ? '✅ Оплачено' : '💳 Отметить оплату'}</button>` : ''}
          <button class="btn small ghost" data-edit="${l.id}">Изменить</button>
          <button class="btn small danger" data-del="${l.id}">Удалить</button>
        </div></div>`;
    }).join('') : '<div class="empty">Занятий пока нет</div>'}`;
  document.getElementById('l-save').onclick = async () => {
    const studentId = val('l-stu'), date = val('l-date'), time = val('l-time');
    const duration = parseInt(val('l-dur'), 10), topic = val('l-topic').trim(), status = val('l-status');
    if (!date || !time || !duration) return tg ? tg.showAlert('Заполните дату, время и длительность') : alert('Заполните поля');
    if (e && e.id) {
      const l = db.lessons.find(x => x.id === e.id);
      if (l.studentId !== studentId) l.rate = stu(studentId).rate;
      Object.assign(l, {studentId, date, time, duration, topic, status});
      if (status === 'cancel') l.paid = false;
    } else {
      db.lessons.push({id: uid(), studentId, date, time, duration, topic, status, paid: false, rate: stu(studentId).rate});
    }
    editing = null; await persist(); render();
  };
  const c = document.getElementById('l-cancel'); if (c) c.onclick = () => { editing = null; render(); };
  view.querySelectorAll('[data-pay]').forEach(b => b.onclick = async () => {
    const l = db.lessons.find(x => x.id === b.dataset.pay); l.paid = !l.paid; await persist(); render();
  });
  view.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => { editing = {type: 'lesson', data: {...db.lessons.find(x => x.id === b.dataset.edit)}}; render(); window.scrollTo(0, 0); });
  view.querySelectorAll('[data-del]').forEach(b => b.onclick = () => confirmDlg('Удалить занятие?', async () => {
    db.lessons = db.lessons.filter(l => l.id !== b.dataset.del); await persist(); render();
  }));
}

function renderStats() {
  const done = db.lessons.filter(l => l.status === 'done');
  const byMonth = {};
  done.forEach(l => {
    const m = l.date.slice(0, 7);
    byMonth[m] = byMonth[m] || {income: 0, hours: 0, expected: 0};
    const sum = l.rate * hours(l);
    byMonth[m].hours += hours(l);
    byMonth[m].expected += sum;
    if (l.paid) byMonth[m].income += sum;
  });
  const months = Object.keys(byMonth).sort().reverse();
  const unpaid = done.filter(l => !l.paid).sort((a, b) => a.date.localeCompare(b.date));
  const totalIncome = months.reduce((s, m) => s + byMonth[m].income, 0);
  const totalHours = months.reduce((s, m) => s + byMonth[m].hours, 0);
  const debt = unpaid.reduce((s, l) => s + l.rate * hours(l), 0);
  const mName = m => new Date(m + '-01').toLocaleDateString('ru-RU', {month: 'long', year: 'numeric'});
  view.innerHTML = `
    <div class="stat">
      <div class="card"><b>${money(totalIncome)}</b><span class="hint">доход (оплачено)</span></div>
      <div class="card"><b>${money(totalHours)} ч</b><span class="hint">отработано</span></div>
    </div>
    <div class="card"><div class="row"><span>Ожидает оплаты</span><b>${money(debt)}</b></div></div>
    <h2>Доход по месяцам</h2>
    ${months.length ? months.map(m => `
      <div class="card"><div class="row"><b>${mName(m)}</b><b>${money(byMonth[m].income)}</b></div>
      <div class="hint">${money(byMonth[m].hours)} ч · начислено ${money(byMonth[m].expected)}</div></div>`).join('')
      : '<div class="empty">Нет проведённых занятий</div>'}
    <h2>Неоплаченные занятия (${unpaid.length})</h2>
    ${unpaid.length ? unpaid.map(l => `
      <div class="card"><div class="row"><b>${esc(stu(l.studentId)?.name || '—')}</b><span>${money(l.rate * hours(l))}</span></div>
      <div class="hint">${fmtDate(l.date)} ${esc(l.time)} · ${esc(l.topic)}</div>
      <div class="actions"><button class="btn small" data-pay="${l.id}">💳 Оплачено</button></div></div>`).join('')
      : '<div class="empty">Всё оплачено 🎉</div>'}`;
  view.querySelectorAll('[data-pay]').forEach(b => b.onclick = async () => {
    db.lessons.find(x => x.id === b.dataset.pay).paid = true; await persist(); render();
  });
}

const val = id => document.getElementById(id).value;
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { tab = b.dataset.tab; editing = null; render(); });

/* ===== Старт ===== */
(async () => {
  try { const d = await Storage.load(); if (d) db = d; } catch (e) { console.error(e); }
  render();
})();
</script>
</body>
</html>
